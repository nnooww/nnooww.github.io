<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>연결할 수 없음</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f4f9; color: #1d2942; font: 15px 'Malgun Gothic', 'Segoe UI', sans-serif; }
    main { width: min(420px, calc(100% - 40px)); padding: 32px; background: #fff; border: 1px solid #dfe4ef; border-radius: 16px; box-shadow: 0 14px 38px #24365a15; }
    h1 { margin: 0 0 8px; font-size: 21px; }
    p { margin: 0; color: #5f6d82; line-height: 1.6; }
  </style>
</head>
<body><main><h1>서버에 연결할 수 없습니다</h1><p>인터넷 연결을 확인하고 앱을 다시 실행해 주세요.</p></main></body>
</html>
