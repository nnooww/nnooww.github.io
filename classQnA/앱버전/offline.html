<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>연결할 수 없음</title>
  <style>
    :root { font-family: "Malgun Gothic", "Noto Sans KR", sans-serif; color: #172235; background: #f7f9fc; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
    main { width: min(100%, 420px); padding: 36px; background: white; border: 1px solid #e3e8f0; border-radius: 18px; box-shadow: 0 12px 38px #1722350e; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { margin: 0 0 24px; line-height: 1.7; color: #566276; }
    a { display: inline-block; padding: 12px 20px; border-radius: 10px; background: #315de6; color: white; text-decoration: none; font-weight: 700; }
    a:focus-visible { outline: 3px solid #172235; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>서버에 연결할 수 없습니다</h1>
    <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요. 서버가 일시 중지된 경우에도 잠시 후 다시 접속할 수 있습니다.</p>
    <a href="https://classroom-question-queue-production.up.railway.app/">다시 시도</a>
  </main>
</body>
</html>
