<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수업 질문 대기열</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <div class="page-width"><h1>수업 질문 대기열</h1></div>
  </header>
  <main class="page-width">
    <section id="auth-view" class="auth-panel" data-mode="choice">
      <div class="auth-tabs" aria-label="시작 방법">
        <button type="button" id="show-signup" class="tab-button">회원가입</button>
        <button type="button" id="show-login" class="tab-button">로그인</button>
      </div>
      <form id="signup-form" hidden>
        <fieldset class="role-options">
          <legend>가입 권한</legend>
          <label class="role-option"><input type="radio" name="signup-role" value="student" checked> 학생</label>
          <label class="role-option"><input id="signup-teacher" type="radio" name="signup-role" value="teacher" disabled> 선생님</label>
          <span id="teacher-availability" class="field-note"></span>
        </fieldset>
        <div class="field"><label for="signup-name">이름</label><input id="signup-name" maxlength="24" placeholder="이름을 입력하세요" required></div>
        <div class="field"><label for="signup-password">비밀번호</label><input id="signup-password" type="password" minlength="8" autocomplete="new-password" required></div>
        <button class="button button-primary">가입하기</button>
      </form>
      <form id="login-form" hidden>
        <div class="field"><label for="login-username">이름 또는 아이디</label><input id="login-username" autocomplete="username" required></div>
        <div class="field"><label for="login-password">비밀번호</label><input id="login-password" type="password" autocomplete="current-password" required></div>
        <button class="button button-primary">로그인</button>
      </form>
      <p id="auth-message" class="message error" role="status"></p>
    </section>

    <section id="app-view" hidden>
      <div class="account-row">
        <strong id="account-label"></strong>
        <div class="account-actions">
          <button id="database-button" type="button" class="button button-light" hidden>DB 보기</button>
          <button id="logout-button" type="button" class="button button-light">로그아웃</button>
        </div>
      </div>

      <section id="student-view" hidden>
        <section id="password-setup" class="content-section" hidden>
          <div class="section-heading"><h2>비밀번호 설정</h2></div>
          <form id="password-setup-form">
            <div class="field"><label for="setup-password">비밀번호</label><input id="setup-password" type="password" minlength="8" autocomplete="new-password" required></div>
            <button class="button button-primary">설정하기</button>
          </form>
          <p id="password-setup-message" class="message error" role="status"></p>
        </section>
        <section class="content-section">
          <div class="section-heading"><h2>질문 신청</h2></div>
          <form id="question-form">
            <div class="field"><label for="question-title">질문 제목</label><input id="question-title" maxlength="80" required></div>
            <div class="field"><label for="question-detail">상세 내용</label><textarea id="question-detail" maxlength="500" rows="4" required></textarea></div>
            <div class="form-footer"><button class="button button-primary">질문 신청하기</button></div>
          </form>
          <p id="question-message" class="message" role="status"></p>
        </section>
        <section class="content-section">
          <div class="section-heading"><h2>내 질문</h2><span id="my-position" class="section-note"></span></div>
          <div id="my-questions" class="item-list"></div>
        </section>
      </section>

      <section id="teacher-view" hidden>
        <p id="admin-message" class="message" role="status"></p>
        <section id="teacher-questions" class="content-section">
          <div class="section-heading"><h2>학생 질문</h2><span id="pending-count" class="count"></span></div>
          <div id="admin-pending" class="item-list"></div>
        </section>
        <section id="database-view" class="content-section" hidden>
          <div class="section-heading database-heading"><h2>데이터베이스</h2><button id="questions-button" type="button" class="button button-light button-small">질문으로 돌아가기</button></div>
          <p id="database-message" class="message error" role="status"></p>
          <h3>사용자</h3>
          <div class="table-scroll"><table class="data-table"><thead><tr><th scope="col">ID</th><th scope="col">이름</th><th scope="col">권한</th><th scope="col">가입일</th></tr></thead><tbody id="database-users"></tbody></table></div>
          <h3>질문</h3>
          <div class="table-scroll"><table class="data-table questions-table"><thead><tr><th scope="col">ID</th><th scope="col">학생</th><th scope="col">제목</th><th scope="col">상세 내용</th><th scope="col">답변</th><th scope="col">상태</th><th scope="col">신청일</th></tr></thead><tbody id="database-questions"></tbody></table></div>
        </section>
      </section>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
